[project]
name = "lobs"
version = "0.1.0"
description = "The Laws of Bullshit: buildable physics worlds with anchors and measurements"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.7,<3", "pyyaml>=6", "pint>=0.24"]

[project.optional-dependencies]
mujoco = ["mujoco>=3.3,<4"]
mesh = ["trimesh>=4", "scipy>=1.11", "fast-simplification"]
decompose = ["coacd"]
gltf = ["lobs[mesh]"]
ifc = ["lobs[mesh]", "ifcopenshell>=0.8"]
usd = ["lobs[mesh]", "usd-core>=25"]
robotics = ["lobs[mesh]", "yourdfpy"]
all-import = ["lobs[gltf,ifc,usd,robotics,decompose]"]
gym = ["gymnasium>=1.0"]
viz = ["rerun-sdk"]
table = ["pandas", "pyarrow"]

[project.scripts]
lobs = "lobs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lobs"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", { name = "linux-glibc231", platform = "linux-64", glibc = "2.31" }, "osx-arm64"]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = ">=1.26"
pydantic = ">=2.7,<3"
pyyaml = ">=6"
pint = ">=0.24"
pychrono = "10.0.*"

[tool.pixi.pypi-dependencies]
mujoco = ">=3.3,<4"
trimesh = ">=4"
scipy = ">=1.11"
fast-simplification = "*"
coacd = "*"
ifcopenshell = ">=0.8"
usd-core = ">=25"
yourdfpy = "*"
gymnasium = ">=1.0"
rerun-sdk = "*"
pandas = "*"
pyarrow = "*"
lobs = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = "*"
hypothesis = "*"
ruff = "*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
probe = "python tools/probe_engines.py"
test  = "pytest -q -m 'not bench'"
bench = "pytest -q -m bench"
lint  = "ruff check src tests tools"
fmt   = "ruff format src tests tools"

[tool.pytest.ini_options]
markers = ["bench: benchmark scenes (slow)", "chrono: needs pychrono", "mujoco: needs mujoco", "imports: needs importer libs"]
testpaths = ["tests", "benchmarks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702", "B008"]
