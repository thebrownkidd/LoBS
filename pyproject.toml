[project]
name = "lobs"
version = "0.1.0"
description = "The Laws of Bullshit: buildable physics worlds with anchors and measurements"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.7,<3", "pyyaml>=6", "pint>=0.24"]

[project.optional-dependencies]
mujoco = ["mujoco>=3.3,<4"]
mesh = ["trimesh>=4", "scipy>=1.11", "fast-simplification"]
decompose = ["coacd"]
gltf = ["lobs[mesh]"]
ifc = ["lobs[mesh]", "ifcopenshell>=0.8"]
usd = ["lobs[mesh]", "usd-core>=25"]
robotics = ["lobs[mesh]"]
all-import = ["lobs[gltf,ifc,usd,robotics,decompose]"]
gym = ["gymnasium>=1.0"]
viz = ["rerun-sdk"]
table = ["pandas", "pyarrow"]
gui = ["PySide6>=6.7,<6.10", "pyqtgraph>=0.13"]
native = ["nanobind>=2.2"]

[project.scripts]
lobs = "lobs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lobs"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", { name = "linux-glibc231", platform = "linux-64", glibc = "2.31" }, "osx-arm64"]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = ">=1.26"
pydantic = ">=2.7,<3"
pyyaml = ">=6"
pint = ">=0.24"
pychrono = "10.0.*"

[tool.pixi.pypi-dependencies]
mujoco = ">=3.3,<4"
trimesh = ">=4"
scipy = ">=1.11"
fast-simplification = "*"
coacd = "*"
ifcopenshell = ">=0.8"
usd-core = ">=25"
gymnasium = ">=1.0"
rerun-sdk = "*"
pandas = "*"
pyarrow = "*"
PySide6 = ">=6.7,<6.10"
pyqtgraph = ">=0.13"
lobs = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = "*"
hypothesis = "*"
ruff = "*"

[tool.pixi.feature.native.dependencies]
cmake = ">=3.26"
ninja = "*"

[tool.pixi.feature.native.pypi-dependencies]
nanobind = ">=2.2"

[tool.pixi.feature.lob.dependencies]
ffmpeg = "*"

[tool.pixi.feature.lob.pypi-dependencies]
torch = ">=2.4"
playwright = "*"
matplotlib = "*"

[tool.pixi.environments]
default = { features = ["dev", "native"], solve-group = "default" }
lob = { features = ["dev", "native", "lob"], solve-group = "default" }

[tool.pixi.tasks]
probe = "python tools/probe_engines.py"
test  = "pytest -q -m 'not bench'"
bench = "pytest -q -m bench"
build-native = "python tools/build_native.py"
throughput = "python benchmarks/bench_throughput.py"
lint  = "ruff check src tests tools demos"
fmt   = "ruff format src tests tools demos"
lob-test   = "pytest -q tests/lobpass"
lob-bench  = "python -m demos.lobpass.bench"
lob-train  = "python -m demos.lobpass.train"
lob-eval   = "python -m demos.lobpass.evaluate"
lob-record = "python -m demos.lobpass.record"
lob-bake   = "python -m demos.lobpass.anim.bake"
lob-video  = "python -m demos.lobpass.capture"

[tool.pytest.ini_options]
markers = ["bench: benchmark scenes (slow)", "chrono: needs pychrono", "mujoco: needs mujoco", "imports: needs importer libs"]
testpaths = ["tests", "benchmarks"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702", "B008"]
